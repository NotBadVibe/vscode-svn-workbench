name: Verify SVN Workbench

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.1
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12.0.2

      - name: Install Subversion on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion xvfb

      - name: Install Subversion on macOS
        if: runner.os == 'macOS'
        run: brew install subversion

      - name: Install Subversion on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svnBin = "C:\Program Files\SlikSvn\bin"
          for ($attempt = 1; $attempt -le 3; $attempt += 1) {
            choco install sliksvn --yes --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $svnBin "svn.exe"))) {
              break
            }
            if ($attempt -eq 3) {
              throw "SlikSVN installation did not produce $svnBin\\svn.exe after $attempt attempts."
            }
            Start-Sleep -Seconds (5 * $attempt)
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability gate
        if: runner.os == 'Linux'
        run: npm run audit:dependencies

      - name: Resolve version context
        id: release-context
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify documentation and version mapping
        run: npm run docs:verify

      - name: Verify SVN CLI
        run: |
          svn --version --quiet
          svnadmin --version --quiet

      - name: Static checks
        run: npm run check

      - name: Unit, domain and coverage gates
        run: npm run test:coverage

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Webview interaction, visual and accessibility acceptance
        run: npm run test:webview

      - name: Performance budgets
        if: runner.os == 'Linux'
        run: npm run test:performance

      - name: Extension Host and real SVN acceptance on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension

      - name: Extension Host and real SVN acceptance
        if: runner.os != 'Linux'
        run: npm run test:extension

      - name: Upload versioned acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svn-workbench-evidence-v${{ steps.release-context.outputs.version }}-${{ runner.os }}-${{ github.sha }}
          path: .validation/evidence
          if-no-files-found: ignore

      - name: Package VSIX and validate clean-profile lifecycle
        if: runner.os == 'Linux'
        run: |
          npm run package:vsix
          npm run validate:vsix-install

      - name: Upload Linux release candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svn-workbench-v${{ steps.release-context.outputs.version }}-${{ github.sha }}-vsix
          path: svn-workbench-*.vsix
